version: "3.9"

# Azure B1ms deployment — Loki + Grafana + Devlogs Collector + MCP server
#
# Usage:
#   cp .env.example .env   # fill in DEVLOGS_TOKEN_MAP_KV and GRAFANA_ADMIN_PASSWORD
#   docker compose -f docker-compose.azure.yml up -d
#
# Services:
#   loki       — Grafana Loki (internal only, :3100)
#   grafana    — Grafana UI (port 3000; add auth or keep internal)
#   collector  — Devlogs Collector (port 8080; proxy TLS with nginx/Caddy)
#   mcp        — MCP server for AI tooling (internal only)
#
# Env vars:
#   DEVLOGS_TOKEN_MAP_KV   — token-to-app-name map, e.g. "mytoken=myapp"
#   GRAFANA_ADMIN_PASSWORD — Grafana admin password
#   DEVLOGS_AUTH_MODE      — optional; default "allow_anonymous"

services:

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "127.0.0.1:3100:3100"   # internal only — not exposed to the internet
    volumes:
      - loki-data:/loki
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"             # expose externally if desired; consider adding auth
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    ports:
      - "8080:8080"             # exposed externally; front with nginx/Caddy for TLS
    environment:
      - DEVLOGS_FORWARD_URL=loki://loki:3100
      - DEVLOGS_TOKEN_MAP_KV=${DEVLOGS_TOKEN_MAP_KV}
      - DEVLOGS_AUTH_MODE=${DEVLOGS_AUTH_MODE:-allow_anonymous}
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      - LOKI_URL=http://loki:3100
      - DEVLOGS_URL=${DEVLOGS_URL:-}
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
